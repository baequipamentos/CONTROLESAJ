# Hospedagem alternativa; Netlify e a configuracao recomendada.
services:
  - type: web
    name: controle-saj
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
