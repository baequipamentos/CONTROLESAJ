name: Validar Controle SAJ
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxe
        run: |
          node --check neon-db.mjs
          node --check server.mjs
          node --check netlify/functions/api.mjs
          node --check public/app.js
          node --check test/validation.test.mjs
      - name: Rodar testes
        run: npm test
